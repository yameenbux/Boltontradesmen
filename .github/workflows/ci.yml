name: CI
on:
  pull_request:
  push:
    branches: [main]

# CI only reads the code: the token it gets can't push, comment or change settings.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db-and-e2e:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Real Supabase CLI stack: db:reset (and the Playwright webServer's e2e-prepare) use
      # `supabase db reset` instead of the local-stack drop-schema reset (ruling R16).
      SUPABASE_CLI_STACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl
      - run: npx supabase start
      # Database tests need an empty register (no e2e fixtures), so reset and run them
      # before the e2e step, whose webServer resets again and loads the fixtures.
      - run: npm run db:reset
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: grep -E '^[A-Z0-9_]+=' .env.example >> "$GITHUB_ENV"
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - run: npm run test:e2e
      # The one-paste production script applies in one transaction on a database at production's state (000017),
      # and the pgTAP tests pass on the result. Last, because it resets the database.
      - run: npm run db:check-prod
      - if: always()
        run: npx supabase stop
