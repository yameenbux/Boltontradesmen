<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Bolton Vouched sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f3ee;color:#1f1a17;font-family:Arial,Helvetica,sans-serif;">
    <!-- Bolton Vouched sign-in code. Used for both "Confirm signup" and "Magic Link" (local, CI and production).
         Shows the code only: no links, so it works inside the installed app. -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ee;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;">
            <tr>
              <td style="padding:32px 28px;">
                <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Your sign-in code</h1>
                <p style="margin:0 0 24px;font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:bold;letter-spacing:8px;">{{ .Token }}</p>
                <p style="margin:0;font-size:16px;line-height:1.5;">It expires in 15 minutes. If you didn't ask for it, ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:13px;color:#6b625c;">Bolton Vouched · boltonvouched.ysbdesigns.uk</p>
        </td>
      </tr>
    </table>
  </body>
</html>
